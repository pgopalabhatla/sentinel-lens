[pytest]
testpaths = tests
pythonpath = .
# The default run skips the slow tests. `pytest -m slow` runs only them; `pytest -m "slow or not slow"` runs everything.
# `pytest -m kafka` runs the tests that go through the broker (start it first: docker compose up -d).
# `pytest -m llm` runs the tests that call the Claude API (they cost a few cents; skipped without ANTHROPIC_API_KEY).
# `pytest -m ui` runs the browser checks of the dashboard (needs Node and `npm install` in dashboard/e2e).
addopts = -m "not slow and not kafka and not llm and not ui"
markers =
    slow: replays the whole test week through the streaming engine, or regenerates the dataset (about 95 s in all)
    kafka: needs the broker from docker-compose.yml on 127.0.0.1:19092; skipped when it is not reachable
    llm: calls the Claude API with the key in ANTHROPIC_API_KEY; skipped without it
    ui: drives the dashboard in a real browser (dashboard/e2e/check.mjs, about 2 min)
