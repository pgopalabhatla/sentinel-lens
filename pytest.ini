[pytest]
testpaths = tests
pythonpath = .
# The default run skips the slow tests. `pytest -m slow` runs only them; `pytest -m "slow or not slow"` runs everything.
# `pytest -m kafka` runs the tests that go through the broker (start it first: docker compose up -d).
addopts = -m "not slow and not kafka"
markers =
    slow: replays the whole test week through the streaming engine, or regenerates the dataset (about 95 s in all)
    kafka: needs the broker from docker-compose.yml on localhost:19092; skipped when it is not reachable
