# Settings of the attacker agent (sentinel_stream/attacker.py). The API key comes from ANTHROPIC_API_KEY, never from here.
model: claude-sonnet-5-5
effort: medium
max_tokens_per_call: 4000
wake_every_minutes: 60          # the agent is woken this often (simulated time) and decides whether to inject
lead_minutes: 2                 # live: a command is scheduled at least this far ahead of the stream clock
stream_version: 2               # injections are validated as for stream v2 (evidence for named scenarios)
budget:
  min_per_day: 1                # asked for in the prompt and reported; cannot be enforced
  max_per_day: 3                # enforced in code
  max_active: 2                 # enforced in code: never more than this many injections active at once
  min_gap_minutes: 180          # enforced in code: injection starts at least this far apart
  max_tool_calls_per_wake: 8
  max_seconds_per_wake: 90
  max_tokens_per_wake: 80000
runs_dir: runs                  # records: runs/attacker/<name>/record.json and control.jsonl (gitignored)
prices_per_mtok:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
