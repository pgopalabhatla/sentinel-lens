# Settings of the per-page triage agent (sentinel_stream/investigator.py). The API key is never here:
# it comes from the environment (ANTHROPIC_API_KEY).
model: claude-sonnet-5-5
effort: medium                 # low | medium | high | xhigh | max; medium is the documented start for multi-step tool use on this model
max_tokens_per_call: 8000      # cap on one response (thinking + text + tool calls)
fallbacks: default             # server-side fallback model if a request is declined by a safety classifier; null to turn off
budget:
  max_tool_calls: 15
  max_seconds: 120             # wall time for the whole investigation, API calls included
  max_tokens: 200000           # input + output tokens over all API calls of one investigation
  final_reserve_seconds: 25    # stop calling tools this long before the deadline, to leave time for the note
follow_up_minutes: 10           # a note that says needs_human "unsure" is re-investigated once, this long after paging
runs_dir: runs                 # full transcripts, one JSON file per page (gitignored)
# USD per million tokens, for the cost estimate. cache_write is the 5-minute cache write (1.25 x input).
prices_per_mtok:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
